name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Lint files
        run: pnpm lint

      - name: Typecheck files
        run: pnpm typecheck

      - name: Validate changesets
        if: (github.head_ref || github.ref_name) != 'changeset-release/main'
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
          pnpm changeset status

      - name: Test
        run: pnpm test --runInBand

      - name: Build
        run: pnpm build

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

      - name: Run CI for release PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          release_branch=$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch"
