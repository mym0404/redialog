pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: pnpm exec oxlint {staged_files}
    format:
      run: pnpm format:check
    types:
      glob: '*.{js,ts,jsx,tsx}'
      run: pnpm exec tsc
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: pnpm exec commitlint --edit
